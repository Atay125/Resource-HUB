<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Resource HUB</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=Barlow+Condensed:wght@400;500;600&family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&family=Doto:wght@700;800&family=Michroma&family=Exo+2:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{
  --bg:#F5F7FA; --rail:#FFFFFF; --panel:#FFFFFF; --panel2:#F0F3F8; --ink:#1D2433; --muted:#667085; --line:#E1E6EE; --soft:#EDF0F5;
  --sig:#3A5BFF; --sig-ink:#FFFFFF; --ok:#1F9D63; --watch:#B26B00; --over:#D6402B; --fore:#7357D9;
  --ok-bg:#E3F5EC; --watch-bg:#FFF1DB; --over-bg:#FDE6E2; --fore-bg:#EEE9FC; --info-bg:#E8EDFF;
  --u0:#F0F3F8; --u1:#DCEBFF; --u2:#A9CBFF; --u3:#FFD38A; --u4:#F28B78;
  --l2:#E4EDFF; --l3:#FFE7BF; --l4:#FBC9BF; --nav:#1D2433; --nav-ink:#C7CEDB; --nav-on:#FFFFFF;
  --hatch:rgba(29,36,51,.18);
  color-scheme:light; box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#11151C; --rail:#171C25; --panel:#171C25; --panel2:#1E2430; --ink:#E6EAF2; --muted:#98A2B3; --line:#2A3241; --soft:#222936;
    --sig:#7D93FF; --sig-ink:#0D1330; --ok:#4FCB8E; --watch:#F2B14C; --over:#FF7A66; --fore:#A88DFF;
    --ok-bg:#163126; --watch-bg:#3A2C12; --over-bg:#431E19; --fore-bg:#2A2347; --info-bg:#1D2546;
    --u0:#1E2430; --u1:#1E2C4A; --u2:#2B4A86; --u3:#7A5A1D; --u4:#8B3426;
    --l2:#1E2C4A; --l3:#4A3A1A; --l4:#5A2820; --nav:#0B0E13; --nav-ink:#98A2B3; --nav-on:#FFFFFF;
    --hatch:rgba(230,234,242,.2);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#11151C; --rail:#171C25; --panel:#171C25; --panel2:#1E2430; --ink:#E6EAF2; --muted:#98A2B3; --line:#2A3241; --soft:#222936;
  --sig:#7D93FF; --sig-ink:#0D1330; --ok:#4FCB8E; --watch:#F2B14C; --over:#FF7A66; --fore:#A88DFF;
  --ok-bg:#163126; --watch-bg:#3A2C12; --over-bg:#431E19; --fore-bg:#2A2347; --info-bg:#1D2546;
  --u0:#1E2430; --u1:#1E2C4A; --u2:#2B4A86; --u3:#7A5A1D; --u4:#8B3426;
  --l2:#1E2C4A; --l3:#4A3A1A; --l4:#5A2820; --nav:#0B0E13; --nav-ink:#98A2B3; --nav-on:#FFFFFF;
  --hatch:rgba(230,234,242,.2);
  color-scheme:dark;
}
html,body{height:100%}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 Figtree,"Segoe UI",system-ui,sans-serif;font-variant-numeric:tabular-nums}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--sig);outline-offset:2px}
h1,h2,h3,.num,.brand{font-family:Figtree,system-ui,sans-serif}
h2{font-size:19px;margin:0 0 10px;font-weight:600}
h3{font-size:15px;margin:18px 0 8px;font-weight:600}
p{margin:0 0 8px}
.muted{color:var(--muted)}.small{font-size:13px}
.hide{display:none!important}

/* top bar */
.top{display:flex;align-items:center;gap:14px;padding:10px 18px;border-bottom:1px solid var(--line);background:var(--panel);position:sticky;top:0;z-index:20;flex-wrap:wrap;min-height:56px}
.brand{font-weight:700;font-size:19px;letter-spacing:.02em;display:flex;align-items:center;gap:8px}
.brand .dot{width:22px;height:22px;border-radius:6px;background:var(--sig);display:inline-grid;place-items:center;color:var(--sig-ink);font-size:12px;font-weight:700}
.tabs{display:flex;gap:2px;flex-wrap:wrap}
.tab{border:none;background:none;padding:7px 12px;border-radius:6px;cursor:pointer;color:var(--muted);font-weight:500}
.tab[aria-selected="true"]{background:var(--panel2);color:var(--ink);box-shadow:inset 0 -2px 0 var(--sig)}
.top .right{margin-left:auto;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.asof{display:flex;gap:6px;align-items:center;font-size:13px;color:var(--muted)}
.asof input{width:140px}
.peers{display:flex;align-items:center;gap:4px;font-size:13px;color:var(--muted)}
.av{width:26px;height:26px;border-radius:50%;display:inline-grid;place-items:center;font-size:11px;font-weight:600;background:var(--panel2);border:1.5px solid var(--line);color:var(--ink)}
.av.pres{border-color:var(--sig)}
.status{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px}
.status i{width:8px;height:8px;border-radius:50%;background:var(--muted);display:inline-block}
.status.shared i{background:var(--ok)}
.status.local i{background:var(--watch)}

/* layout */
.wrap{display:grid;grid-template-columns:232px minmax(0,1fr) 320px;min-height:calc(100% - 56px)}
body:not([data-section="rm"]) .wrap{grid-template-columns:232px minmax(0,1fr)}
body:not([data-section="rm"]) .rail{display:none}
.rail{background:var(--rail);border-left:1px solid var(--line);padding:16px 14px 40px;position:sticky;top:56px;align-self:start;max-height:calc(100vh - 56px);overflow:auto;order:3}
.sidenav{background:var(--nav);color:var(--nav-ink);padding:14px 10px 40px;position:sticky;top:56px;align-self:start;height:calc(100vh - 56px);overflow:auto}
.navsec{margin-bottom:6px}
.navhead{display:block;width:100%;text-align:left;background:none;border:none;color:var(--nav-ink);font-weight:600;padding:8px 10px;border-radius:8px;cursor:pointer;font-size:13px}
.navsec.on .navhead{color:var(--nav-on);background:rgba(255,255,255,.07)}
.navtabs{display:grid;gap:1px;margin:4px 0 8px}
.navtab{display:flex;justify-content:space-between;align-items:center;text-align:left;background:none;border:none;color:var(--nav-ink);padding:6px 10px 6px 20px;border-radius:7px;cursor:pointer;font-size:14px}
.navtab:hover{color:var(--nav-on)}
.navtab[aria-current="page"]{background:var(--sig);color:var(--sig-ink);font-weight:600}
.nbadge{background:var(--over);color:#fff;border-radius:10px;font-size:11px;padding:0 6px;font-weight:700}
main{padding:20px 24px 80px;min-width:0;order:2}
.rail h2{display:flex;align-items:center;gap:8px}
.counts{display:flex;gap:6px;margin:0 0 12px;flex-wrap:wrap}
.cnt{font-size:12px;padding:2px 8px;border-radius:20px;font-weight:600}
.cnt.d{background:var(--over-bg);color:var(--over)}.cnt.w{background:var(--watch-bg);color:var(--watch)}.cnt.i{background:var(--info-bg);color:var(--sig)}
.sig{display:grid;grid-template-columns:14px 1fr;gap:10px;padding:10px 10px 10px 8px;border-radius:8px;background:var(--panel);margin-bottom:8px;border:1px solid var(--line);cursor:pointer;text-align:left;width:100%}
.sig:hover{border-color:var(--muted)}
.sig .bead{width:10px;height:10px;border-radius:50%;margin-top:5px;position:relative}
.sig.danger .bead{background:var(--over)}.sig.warn .bead{background:var(--watch)}.sig.info .bead{background:var(--sig)}.sig.fore .bead{background:var(--fore)}
.sig.new .bead::after{content:"";position:absolute;inset:-6px;border-radius:50%;border:2px solid currentColor;animation:ping 1.6s ease-out 3}
.sig.danger{color:var(--over)}.sig.warn{color:var(--watch)}.sig.info{color:var(--sig)}.sig.fore{color:var(--fore)}
.sig .txt{color:var(--ink);font-size:14px}
.sig .txt small{display:block;color:var(--muted);font-size:12px;margin-top:2px}
@keyframes ping{0%{transform:scale(.6);opacity:1}100%{transform:scale(2.2);opacity:0}}
.filter{display:flex;gap:4px;margin-bottom:10px}
.filter button{border:1px solid var(--line);background:var(--panel);border-radius:20px;padding:2px 10px;font-size:12px;cursor:pointer}
.filter button[aria-pressed="true"]{border-color:var(--sig);color:var(--sig)}

/* generic */
.btn{border:1px solid var(--line);background:var(--panel);border-radius:6px;padding:6px 12px;cursor:pointer}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--sig);border-color:var(--sig);color:var(--sig-ink);font-weight:600}
.btn.danger{color:var(--over)}
.btn.sm{padding:3px 8px;font-size:13px}
.link{border:none;background:none;color:var(--sig);cursor:pointer;padding:0;text-decoration:underline;font-size:inherit}
input[type=text],input[type=number],input[type=date],select,textarea{border:1px solid var(--line);background:var(--panel);border-radius:6px;padding:5px 8px;min-width:0}
textarea{width:100%;min-height:70px;resize:vertical}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:16px}
.section{margin-top:26px}
.scroll{overflow-x:auto}
table{border-collapse:collapse}
.tbl{width:100%;font-size:14px}
.tbl th,.tbl td{padding:7px 8px;border-bottom:1px solid var(--soft);text-align:left;vertical-align:middle}
.tbl th{font-weight:600;color:var(--muted);font-size:13px}
.tbl td.r,.tbl th.r{text-align:right}
.pill{display:inline-block;font-size:12px;padding:1px 8px;border-radius:20px;font-weight:600;white-space:nowrap}
.pill.live{background:var(--ok-bg);color:var(--ok)}.pill.pipeline{background:var(--fore-bg);color:var(--fore)}.pill.paused{background:var(--soft);color:var(--muted)}.pill.wrapped{background:var(--soft);color:var(--muted)}
.pill.pencil{background:var(--watch-bg);color:var(--watch)}.pill.booked{background:var(--ok-bg);color:var(--ok)}
.empty{max-width:62ch;padding:30px 0}
.empty h1{font-size:30px;line-height:1.15;margin:0 0 12px}

/* KPIs */
.kpis{display:flex;gap:28px;flex-wrap:wrap;margin:4px 0 22px}
.kpi .num{font-size:28px;font-weight:600;line-height:1.1}
.kpi span{color:var(--muted);font-size:13px}

/* heatmap */
table.heat{border-collapse:separate;border-spacing:3px;font-size:13px}
.heat th{font-weight:500;color:var(--muted);font-size:12px;padding:0 4px;text-align:center;white-space:nowrap}
.heat th.who{text-align:left;padding-right:10px;color:var(--ink);font-size:14px;font-weight:500;min-width:150px;position:sticky;left:0;background:var(--panel);z-index:1}
.heat th.who small{display:block;color:var(--muted);font-size:12px;font-weight:400}
.heat td{width:74px;min-width:74px;height:40px;border-radius:6px;text-align:center;cursor:pointer;position:relative;font-family:Figtree,system-ui,sans-serif;font-weight:600}
.heat td.u0{background:var(--u0);color:var(--muted);font-weight:500}.heat td.u1{background:var(--u1)}.heat td.u2{background:var(--u2)}.heat td.u3{background:var(--u3)}.heat td.u4{background:var(--u4);color:#fff}
.heat td.pen::after{content:"";position:absolute;left:4px;right:4px;bottom:4px;height:4px;border-radius:2px;background:repeating-linear-gradient(90deg,var(--watch) 0 4px,transparent 4px 7px)}
.heat td.out{background:repeating-linear-gradient(135deg,var(--hatch) 0 3px,transparent 3px 7px),var(--u0);color:var(--muted)}
.heat td small{display:block;font-family:Figtree,system-ui,sans-serif;font-weight:500;font-size:11px;color:inherit;opacity:.85}
.heat td.now{box-shadow:inset 0 0 0 2px var(--sig)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin:8px 0 0}
.legend i{display:inline-block;width:14px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}

/* project cards */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px;cursor:pointer;text-align:left;width:100%;display:block}
.card:hover{border-color:var(--muted)}
.card h3{margin:0 0 4px;font-size:16px;display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.card .meta{font-size:13px;color:var(--muted)}
.bar{height:6px;border-radius:3px;background:var(--soft);overflow:hidden;margin:10px 0 6px;display:flex}
.bar span{display:block;height:100%}
.card .foot{display:flex;justify-content:space-between;font-size:13px;margin-top:6px;gap:8px}
.delta{font-size:12px;font-weight:600}
.delta.up{color:var(--over)}.delta.down{color:var(--ok)}
.team{display:flex;gap:3px;margin-top:8px;flex-wrap:wrap}

/* drawer */
.scrim{position:fixed;inset:0;background:rgba(5,12,16,.45);z-index:40}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(980px,100%);background:var(--bg);z-index:41;overflow:auto;border-left:1px solid var(--line);padding:calc(18px + env(safe-area-inset-top,0px)) 22px calc(60px + env(safe-area-inset-bottom,0px))}
.drawer .head{display:flex;gap:10px;align-items:center;margin-bottom:12px}
.drawer .head input.title{font-family:Figtree,system-ui,sans-serif;font-size:22px;font-weight:600;border:1px solid transparent;background:transparent;flex:1;padding:2px 6px}
.drawer .head input.title:hover,.drawer .head input.title:focus{border-color:var(--line);background:var(--panel)}
.fields{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px 14px}
.fields label{display:flex;flex-direction:column;gap:3px;font-size:13px;color:var(--muted)}
.fields label input,.fields label select{color:var(--ink)}
.fields .chk{flex-direction:row;align-items:center;gap:8px;color:var(--ink)}
.tbl input[type=number]{width:62px;text-align:right;padding:3px 5px}
.tbl input[type=text]{width:100%;min-width:110px;padding:3px 6px}
.tbl input[type=date]{padding:3px 5px;width:132px}
.tbl select{padding:3px 5px;max-width:170px}
table.gantt{border-collapse:separate;border-spacing:2px;font-size:12px}
.gantt th{font-weight:500;color:var(--muted);padding:0 3px;white-space:nowrap;text-align:center}
.gantt th.who{text-align:left;min-width:150px;color:var(--ink);font-size:13px;position:sticky;left:0;background:var(--bg)}
.gantt td{width:44px;min-width:44px;height:28px;text-align:center;border-radius:4px;background:var(--u0);font-family:Figtree,system-ui,sans-serif;font-weight:600}
.gantt td.on{background:var(--u2)}
.gantt td.hot{background:var(--u4);color:#fff}
.gantt td.awayc{background:repeating-linear-gradient(135deg,var(--hatch) 0 3px,transparent 3px 7px),var(--u2)}
.gantt tr.stg td{height:14px;background:transparent}
.gantt tr.stg td.s{background:var(--sig);opacity:.55}

/* meeting */
.agenda{display:grid;gap:14px}
.ag{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px 16px}
.ag.focus{border-color:var(--sig);box-shadow:0 0 0 3px color-mix(in srgb,var(--sig) 25%,transparent)}
.ag h3{margin:0;display:flex;align-items:center;gap:10px}
.ag .cols{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px;margin-top:10px}
.actions-list{list-style:none;padding:0;margin:6px 0}
.actions-list li{display:flex;gap:8px;align-items:center;padding:4px 0;border-bottom:1px solid var(--soft);font-size:14px}
.actions-list li.done span{text-decoration:line-through;color:var(--muted)}
.addact{display:grid;grid-template-columns:1fr 130px auto;gap:6px}
.presbar{position:sticky;top:56px;z-index:5;background:var(--sig);color:var(--sig-ink);padding:8px 14px;border-radius:8px;display:flex;gap:12px;align-items:center;margin-bottom:14px;font-weight:600}
.presbar button{background:transparent;border:1px solid currentColor;color:inherit;border-radius:6px;padding:3px 10px;cursor:pointer}

/* toasts */
.toasts{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));display:grid;gap:8px;z-index:60;max-width:360px}
.toast{background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--sig);border-radius:8px;padding:10px 12px;font-size:14px;box-shadow:0 6px 20px rgba(0,0,0,.18);animation:slide .25s ease-out}
.toast.danger{border-left-color:var(--over)}.toast.warn{border-left-color:var(--watch)}
@keyframes slide{from{transform:translateY(10px);opacity:0}to{transform:none;opacity:1}}

/* assistant */
.askbtn{position:fixed;left:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:30}
.ask{position:fixed;left:16px;bottom:calc(64px + env(safe-area-inset-bottom,0px));width:min(440px,calc(100% - 32px));max-height:70vh;display:flex;flex-direction:column;background:var(--panel);border:1px solid var(--line);border-radius:12px;z-index:31;box-shadow:0 10px 30px rgba(0,0,0,.25)}
.ask .out{padding:12px 14px;overflow:auto;font-size:14px;white-space:pre-wrap;flex:1;min-height:80px}
.ask .in{display:flex;gap:6px;padding:10px;border-top:1px solid var(--line)}
.ask .in input{flex:1}
.ask .quick{display:flex;gap:6px;flex-wrap:wrap;padding:10px 12px 0}
.ask .quick button{font-size:12px}

.drop{border:1.5px dashed var(--line);border-radius:10px;padding:22px;text-align:center;cursor:pointer;background:var(--panel)}
.drop.over{border-color:var(--sig)}
.err{background:var(--over-bg);color:var(--over);border-radius:6px;padding:8px 12px;font-size:14px;margin:8px 0}
.note{background:var(--info-bg);border-radius:6px;padding:8px 12px;font-size:14px;margin:8px 0}

.scen{background:var(--fore-bg);color:var(--ink);border:1px solid var(--fore);border-radius:8px;padding:10px 14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:16px}
.scen input{font-weight:600;width:180px}
.scen .grow{flex:1;min-width:200px;font-size:14px;color:var(--muted)}
.cmp td.up{color:var(--over);font-weight:600}.cmp td.down{color:var(--ok);font-weight:600}
.pill.fl-recruiting{background:var(--soft);color:var(--muted)}.pill.fl-pencilled{background:var(--watch-bg);color:var(--watch)}.pill.fl-booked{background:var(--ok-bg);color:var(--ok)}.pill.fl-released{background:var(--soft);color:var(--muted)}
.upd{padding:8px 0;border-bottom:1px solid var(--soft);font-size:14px}
table.sht{border-collapse:separate;border-spacing:2px;font-size:12px}
.sht th{font-weight:500;color:var(--muted);padding:0 3px;white-space:nowrap;text-align:center}
.sht th.lab{text-align:left;position:sticky;left:0;background:var(--panel);z-index:1;min-width:200px;max-width:320px;white-space:normal;color:var(--ink);font-size:13px;padding-right:8px}
.sht td{min-width:46px;height:26px;border-radius:4px;text-align:center;background:var(--u0);white-space:nowrap;overflow:hidden;max-width:90px;text-overflow:ellipsis;padding:0 3px}
.sht td.n1{background:var(--u1)}.sht td.n2{background:var(--u2);font-weight:600}.sht td.n3{background:var(--u3);font-weight:600}.sht td.n4{background:var(--u4);color:#fff;font-weight:600}
.sht td.k{background:color-mix(in srgb,var(--k) 35%,var(--panel));font-weight:600}
.k0{--k:#5D86B0}.k1{--k:#C48A3A}.k2{--k:#6F9A73}.k3{--k:#B0607A}.k4{--k:#8676B0}.k5{--k:#4E9AA0}.k6{--k:#A88E52}.k7{--k:#7F8C94}
.chg{display:grid;grid-template-columns:22px 1fr;gap:8px;padding:8px 0;border-bottom:1px solid var(--soft);font-size:14px}
.chg .iss{color:var(--watch);font-size:13px}
.msg{border:1px solid var(--line);border-radius:8px;padding:10px;margin:8px 0;background:var(--panel2)}
.msg textarea{min-height:80px;margin:6px 0}
/* HUB components */
.pagehead{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.pagehead h1{font-size:24px;margin:0 0 2px;font-weight:700;letter-spacing:-.01em}
.pagehead p{margin:0;max-width:80ch}
input.title.big{font-size:22px;font-weight:700;border:1px solid transparent;background:transparent;padding:2px 6px;margin-left:-6px;width:min(520px,100%)}
input.title.big:hover,input.title.big:focus{border-color:var(--line);background:var(--panel)}
.panel.tight{padding:8px}
.btn.ghost{border-color:transparent;background:transparent;color:var(--muted)}

/* ===== Console look (inspired by the original Xbox dashboard, in blue / black / grey / white) ===== */
body[data-skin="console"]{
  --bg:#03060B;--rail:rgba(6,14,26,.72);--panel:rgba(8,20,36,.78);--panel2:rgba(14,32,56,.85);--ink:#E9F2FF;--muted:#8EA4C2;--line:#1D4170;--soft:#102742;
  --sig:#3D8BFF;--sig-ink:#02101F;--ok:#7CC4FF;--watch:#D7DEE8;--over:#FF5D73;--fore:#9FB3FF;
  --ok-bg:#0E2A48;--watch-bg:#1C2A3D;--over-bg:#3A0F1C;--fore-bg:#18244A;--info-bg:#0E2342;
  --u0:#0B1A2C;--u1:#0F2C4F;--u2:#1B4F8F;--u3:#3D8BFF;--u4:#FF5D73;--l2:#0F2C4F;--l3:#1B4F8F;--l4:#5A1A2B;
  --nav:transparent;--nav-ink:#9FB6D6;--nav-on:#FFFFFF;--hatch:rgba(160,200,255,.18);--glow:0 0 0 1px rgba(61,139,255,.45),0 0 18px rgba(61,139,255,.25);
  color-scheme:dark;
  font-family:"Exo 2",Figtree,system-ui,sans-serif;
  background:
    radial-gradient(1200px 700px at 18% 30%,rgba(61,139,255,.16),transparent 60%),
    radial-gradient(900px 600px at 90% 90%,rgba(61,139,255,.08),transparent 60%),
    repeating-radial-gradient(circle at 15% 35%,transparent 0 58px,rgba(61,139,255,.07) 58px 59px),
    repeating-linear-gradient(115deg,transparent 0 120px,rgba(61,139,255,.05) 120px 121px),
    #03060B;
  background-attachment:fixed;
}
body[data-skin="console"] h1,body[data-skin="console"] h2,body[data-skin="console"] h3,body[data-skin="console"] .brand,body[data-skin="console"] .num,
body[data-skin="console"] .navhead,body[data-skin="console"] .pagehead h1{font-family:Michroma,"Exo 2",system-ui,sans-serif;letter-spacing:.06em;text-transform:uppercase}
body[data-skin="console"] h1{font-size:20px}body[data-skin="console"] h2{font-size:14px}body[data-skin="console"] h3{font-size:12px}
body[data-skin="console"] .top{background:linear-gradient(180deg,rgba(6,16,30,.95),rgba(4,10,20,.85));border-bottom:1px solid #1D4170;box-shadow:0 1px 0 rgba(61,139,255,.35),0 8px 30px rgba(0,0,0,.5)}
body[data-skin="console"] .brand .dot{border-radius:50%;width:26px;height:26px;background:radial-gradient(circle at 35% 30%,#fff 0,#9CC4FF 18%,#3D8BFF 45%,#0B2C5C 80%);box-shadow:0 0 14px rgba(61,139,255,.7);color:transparent}
body[data-skin="console"] .sidenav{background:linear-gradient(180deg,rgba(4,10,20,.6),rgba(4,10,20,.2));border-right:1px solid rgba(61,139,255,.2)}
body[data-skin="console"] .navhead{font-size:10px;color:#6F8BB0;background:none!important}
body[data-skin="console"] .navsec.on .navhead{color:#CFE0FF}
body[data-skin="console"] .navtabs{gap:6px;margin:6px 0 12px}
body[data-skin="console"] .navtab{position:relative;padding:4px 10px 4px 4px;gap:8px;justify-content:flex-start;border-radius:0;background:linear-gradient(90deg,rgba(18,40,70,.85),rgba(10,24,44,.6));
  clip-path:polygon(0 0,calc(100% - 10px) 0,100% 10px,100% 100%,10px 100%,0 calc(100% - 10px));box-shadow:inset 0 0 0 1px rgba(61,139,255,.35);color:#CFE0FF}
body[data-skin="console"] .navtab .orb{display:grid}
body[data-skin="console"] .navtab .nl{text-transform:uppercase;letter-spacing:.06em;font-size:11px;font-weight:600;line-height:1.2;text-align:left}
body[data-skin="console"] .navtab .nl small{display:block;text-transform:none;letter-spacing:0;font-size:11px;font-weight:400;color:#8EA4C2}
body[data-skin="console"] .navtab[aria-current="page"]{background:linear-gradient(90deg,#CFE3FF,#7FB2FF);color:#02101F;font-weight:700}
body[data-skin="console"] .navtab[aria-current="page"] .nl small{color:#0B2C5C}
body[data-skin="console"] .nbadge{position:absolute;right:8px;top:6px}
/* orbs */
body[data-skin="console"] .orb{place-items:center;width:30px;height:30px;flex:none;border-radius:50%;color:#EAF3FF;
  background:radial-gradient(circle at 35% 28%,rgba(255,255,255,.9) 0,rgba(160,200,255,.6) 12%,rgba(61,139,255,.55) 35%,rgba(8,30,62,.95) 75%);
  box-shadow:0 0 0 1px rgba(160,200,255,.5),0 0 12px rgba(61,139,255,.55),inset 0 -4px 8px rgba(0,0,0,.45)}
body[data-skin="console"] .orb svg{width:60%;height:60%;filter:drop-shadow(0 0 2px rgba(0,0,0,.6))}
body[data-skin="console"] .orb.lg{width:66px;height:66px}

  clip-path:polygon(0 0,calc(100% - 16px) 0,100% 16px,100% 100%,16px 100%,0 calc(100% - 16px));backdrop-filter:blur(6px)}
body[data-skin="console"] .card:hover{box-shadow:0 0 0 1px rgba(160,200,255,.7),0 0 26px rgba(61,139,255,.35)}
body[data-skin="console"] .btn{border-radius:0;clip-path:polygon(0 0,calc(100% - 8px) 0,100% 8px,100% 100%,8px 100%,0 calc(100% - 8px));background:linear-gradient(180deg,rgba(24,52,90,.9),rgba(12,28,52,.9));border:1px solid rgba(61,139,255,.5);color:#DCEBFF;text-transform:uppercase;letter-spacing:.06em;font-size:11px;font-weight:600}
body[data-skin="console"] .btn:hover{border-color:#9CC4FF;color:#fff}
body[data-skin="console"] .btn.primary{background:linear-gradient(180deg,#CFE3FF,#6FA8FF);color:#02101F;border-color:#CFE3FF}
body[data-skin="console"] .btn.ghost{background:transparent;border-color:transparent;clip-path:none}
body[data-skin="console"] input[type=text],body[data-skin="console"] input[type=number],body[data-skin="console"] input[type=date],body[data-skin="console"] select,body[data-skin="console"] textarea{background:rgba(4,12,24,.85);border-color:#1D4170;color:var(--ink)}
body[data-skin="console"] .rail{background:linear-gradient(180deg,rgba(4,10,20,.75),rgba(4,10,20,.45));border-left:1px solid rgba(61,139,255,.25)}
body[data-skin="console"] .sig{border-radius:0;background:linear-gradient(90deg,rgba(14,32,56,.9),rgba(8,20,36,.7));border:1px solid rgba(61,139,255,.3);clip-path:polygon(0 0,calc(100% - 10px) 0,100% 10px,100% 100%,0 100%)}
body[data-skin="console"] .sig .bead{width:12px;height:12px;box-shadow:0 0 10px currentColor}
body[data-skin="console"] .sig.info{color:#7CB4FF}body[data-skin="console"] .sig.warn,body[data-skin="console"] .sig.fore{color:#D7DEE8}body[data-skin="console"] .sig.danger{color:#FF5D73}

/* home */
body[data-skin="console"] .home{display:grid;grid-template-columns:minmax(260px,360px) minmax(280px,1fr);grid-template-areas:"core menu" "orbs orbs" "feed feed";gap:22px 32px;align-items:center;padding:8px 4px 20px}
body[data-skin="console"] .hcore{grid-area:core;display:grid;place-items:center}
body[data-skin="console"] .bigorb{position:relative;width:min(320px,70vw);aspect-ratio:1;border-radius:50%;display:grid;place-items:center;
  background:radial-gradient(circle at 35% 28%,rgba(255,255,255,.95) 0,rgba(180,214,255,.75) 10%,rgba(61,139,255,.6) 32%,rgba(10,40,84,.95) 70%,rgba(3,10,22,1) 100%);
  box-shadow:0 0 0 2px rgba(160,200,255,.45),0 0 60px rgba(61,139,255,.55),0 0 140px rgba(61,139,255,.25),inset 0 -20px 40px rgba(0,0,0,.55)}
body[data-skin="console"] .bigorb .ringg{position:absolute;inset:-14px;border-radius:50%;background:conic-gradient(#CFE3FF calc(var(--p)*1%),rgba(61,139,255,.15) 0);

body[data-skin="console"] .hmenu{grid-area:menu;display:grid;gap:14px}
body[data-skin="console"] .hbar{display:flex;align-items:center;gap:12px;border:none;cursor:pointer;text-align:left;padding:6px 18px 6px 6px;color:#CFE0FF;
  background:linear-gradient(90deg,rgba(18,40,70,.9),rgba(10,24,44,.55));box-shadow:inset 0 0 0 1px rgba(61,139,255,.45),0 0 18px rgba(61,139,255,.15);
  clip-path:polygon(0 0,calc(100% - 14px) 0,100% 14px,100% 100%,14px 100%,0 calc(100% - 14px));transition:transform .12s}
body[data-skin="console"] .hbar:hover,body[data-skin="console"] .hbar:focus-visible{background:linear-gradient(90deg,#CFE3FF,#7FB2FF);color:#02101F;transform:translateX(6px)}
body[data-skin="console"] .hbar .orb{display:grid;width:44px;height:44px}
body[data-skin="console"] .hbl{font-family:Michroma,system-ui,sans-serif;text-transform:uppercase;letter-spacing:.08em;font-size:15px}
body[data-skin="console"] .hbl small{display:block;font-family:"Exo 2",system-ui,sans-serif;text-transform:none;letter-spacing:0;font-size:12px;opacity:.8;margin-top:2px}
body[data-skin="console"] .horbs{grid-area:orbs;display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:18px}
body[data-skin="console"] .hw{border:none;background:none;cursor:pointer;display:grid;justify-items:center;gap:0;color:var(--ink);padding:0}
body[data-skin="console"] .hw .orb.lg{display:grid;transition:transform .15s}
body[data-skin="console"] .hw:hover .orb.lg,body[data-skin="console"] .hw:focus-visible .orb.lg{transform:scale(1.08);box-shadow:0 0 0 1px #CFE3FF,0 0 26px rgba(61,139,255,.85)}
body[data-skin="console"] .plate{margin-top:-8px;min-width:140px;padding:6px 12px;display:grid;justify-items:center;background:linear-gradient(180deg,rgba(24,52,90,.95),rgba(10,24,44,.95));box-shadow:inset 0 0 0 1px rgba(61,139,255,.55);
  clip-path:polygon(10px 0,100% 0,100% calc(100% - 10px),calc(100% - 10px) 100%,0 100%,0 10px)}
body[data-skin="console"] .plate span{font-family:Michroma,system-ui,sans-serif;text-transform:uppercase;letter-spacing:.08em;font-size:10px;color:#9FB6D6}
body[data-skin="console"] .plate b{font-size:18px;color:#fff;max-width:170px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
body[data-skin="console"] .plate small{font-size:11px;color:#8EA4C2}
body[data-skin="console"] .hfeed{grid-area:feed}
body[data-skin="console"] .hfh{font-family:Michroma,system-ui,sans-serif;text-transform:uppercase;letter-spacing:.1em;font-size:11px;color:#9FB6D6;margin-bottom:8px}
@media (max-width:900px){.home{grid-template-columns:1fr;grid-template-areas:"core" "menu" "orbs" "feed"}}
@media (prefers-reduced-motion:no-preference){body[data-skin="console"] .bigorb{animation:breathe 6s ease-in-out infinite}@keyframes breathe{50%{box-shadow:0 0 0 2px rgba(160,200,255,.55),0 0 80px rgba(61,139,255,.7),0 0 160px rgba(61,139,255,.3),inset 0 -20px 40px rgba(0,0,0,.55)}}}

body[data-skin="graphite"]{--bg:#F3F3F1;--rail:#FFFFFF;--panel:#FFFFFF;--panel2:#F7F7F5;--ink:#111113;--muted:#5F5F66;--line:#E2E2DF;--soft:#EDEDEA;
  --sig:#111113;--sig-ink:#FFFFFF;--ok:#2F7A4B;--watch:#9A6200;--over:#C9352B;--fore:#5F5F66;--ok-bg:#E6EFE8;--watch-bg:#F6EBD6;--over-bg:#F8E1DE;--fore-bg:#EDEDEA;--info-bg:#EDEDEA;
  --u0:#F3F3F1;--u1:#E3E4E7;--u2:#B9BBC2;--u3:#E9C27C;--u4:#E59A92;--l2:#E3E4E7;--l3:#F3D9A8;--l4:#F2C4BF;--nav:#151517;--nav-ink:#A3A3A7;--nav-on:#F5F5F4;--hatch:rgba(17,17,19,.16);
  color-scheme:light;background:#F3F3F1;color:#111113;font-family:Geist,system-ui,sans-serif}
body[data-skin="graphite"] .top{background:#151517;color:#F5F5F4;border-bottom:none;padding:14px 32px 10px;gap:10px 18px;position:sticky;top:0}
body[data-skin="graphite"] .brand{font-family:'Tallboy',Geist,sans-serif;font-weight:400;font-size:28px;letter-spacing:.02em;text-transform:uppercase;gap:4px}
body[data-skin="graphite"] .brand .dot{display:none}
body[data-skin="graphite"] .brand::before{content:"/";font-family:'Geist Mono',monospace;font-size:18px;margin-right:2px}
body[data-skin="graphite"] #gtabs{display:flex;flex-wrap:wrap;gap:4px;margin-left:auto;order:2}
body[data-skin="graphite"] .top .right{order:3;width:100%;justify-content:flex-end;gap:12px;font-size:12px}
body[data-skin="graphite"] .top .right label.asof{color:#A3A3A7}
body[data-skin="graphite"] .top select,body[data-skin="graphite"] .top input{background:transparent;color:#F5F5F4;border:1px solid #2C2C30;border-radius:0}
body[data-skin="graphite"] .top select option{color:#111113}
.gtab{display:inline-block;padding:7px 14px;border-radius:999px;color:#A3A3A7;font:inherit;font-size:14px;font-weight:500;text-decoration:none;border:1px solid transparent;background:transparent;cursor:pointer;transition:background .2s,border-color .2s,color .2s}
.gtab:hover{color:#F5F5F4;background:rgba(255,255,255,.06);border-color:rgba(255,255,255,.14)}
.gtab[aria-current="page"]{color:#FFFFFF;font-weight:600;background:linear-gradient(180deg,rgba(255,255,255,.2),rgba(255,255,255,.05));border-color:rgba(255,255,255,.34);box-shadow:inset 0 1px 0 rgba(255,255,255,.4),0 6px 18px rgba(0,0,0,.35);backdrop-filter:blur(8px)}
.gtab .gcount{display:inline-block;margin-left:6px;background:#C9352B;color:#fff;border-radius:999px;font-size:11px;padding:0 6px;font-weight:700}
.gmore{position:relative}
.gmenu{position:absolute;right:0;top:calc(100% + 6px);background:#1C1C1F;border:1px solid #2C2C30;min-width:220px;padding:6px;z-index:60;display:grid;gap:2px}
.gmenu button{background:none;border:none;color:#D5D5D8;text-align:left;padding:8px 10px;font:inherit;font-size:13px;cursor:pointer}
.gmenu button:hover{background:#2A2A2E;color:#fff}
.gmenu .gml{font-family:'Geist Mono',monospace;font-size:11px;color:#77777E;padding:8px 10px 2px}
body[data-skin="graphite"] .wrap{grid-template-columns:minmax(0,1fr)!important}
body[data-skin="graphite"] .sidenav{display:none}
body[data-skin="graphite"] main{padding:0 32px 80px;max-width:1440px;margin:0 auto;width:100%;box-sizing:border-box}
body[data-skin="graphite"] .rail{position:fixed;top:0;right:0;bottom:0;width:min(400px,100vw);max-height:none;z-index:50;transform:translateX(105%);transition:transform .25s ease;box-shadow:-20px 0 40px rgba(0,0,0,.18);display:block!important;padding-top:calc(16px + env(safe-area-inset-top,0px))}
body[data-skin="graphite"].railopen .rail{transform:none}
body[data-skin="graphite"] .railclose{display:inline-block;margin-left:auto}
body[data-skin="graphite"] .pagehead{background:#151517;color:#F5F5F4;margin:0 -32px 22px;padding:22px 32px 26px;align-items:flex-end}
body[data-skin="graphite"] .pagehead h1{font-family:'Tallboy',Geist,sans-serif;font-weight:400;font-size:76px;line-height:.9;letter-spacing:.01em;text-transform:uppercase;margin:0}
body[data-skin="graphite"] .pagehead p,body[data-skin="graphite"] .pagehead .muted{color:#A3A3A7}
body[data-skin="graphite"] .pagehead .btn{background:transparent;color:#F5F5F4;border-color:#2C2C30}
body[data-skin="graphite"] .pagehead .btn.primary{background:#D8DBE0;color:#111113;border-color:#D8DBE0}
body[data-skin="graphite"] .pagehead select,body[data-skin="graphite"] .pagehead input{background:transparent;color:#F5F5F4;border-color:#2C2C30}
body[data-skin="graphite"] .pagehead .seg{border-color:#2C2C30}
body[data-skin="graphite"] .pagehead .seg button{background:transparent;color:#A3A3A7}
body[data-skin="graphite"] .pagehead .seg button[aria-pressed="true"]{background:#D8DBE0;color:#111113}
body[data-skin="graphite"] h2,body[data-skin="graphite"] .panel h2,body[data-skin="graphite"] .section>h2{font-family:'Barlow Condensed',Geist,sans-serif;font-weight:500;font-size:22px;letter-spacing:.03em;text-transform:uppercase}
body[data-skin="graphite"] h3{font-family:'Barlow Condensed',Geist,sans-serif;font-weight:500;font-size:17px;letter-spacing:.03em;text-transform:uppercase}
body[data-skin="graphite"] .btn{border-radius:0}
body[data-skin="graphite"] .btn.primary{background:#111113;border-color:#111113;color:#fff}
body[data-skin="graphite"] input,body[data-skin="graphite"] select,body[data-skin="graphite"] textarea{border-radius:0}
body[data-skin="graphite"] .panel,body[data-skin="graphite"] .card,body[data-skin="graphite"] .sheet,body[data-skin="graphite"] .todo,body[data-skin="graphite"] .sbjob,body[data-skin="graphite"] .sbtray,body[data-skin="graphite"] .sbcmp,body[data-skin="graphite"] .chart{border-radius:18px;transition:border-radius .25s ease}
body[data-skin="graphite"] .panel:hover,body[data-skin="graphite"] .panel:focus-within,body[data-skin="graphite"] .card:hover,body[data-skin="graphite"] .sheet:hover,body[data-skin="graphite"] .todo:hover,body[data-skin="graphite"] .sbjob:hover,body[data-skin="graphite"] .chart:hover{border-radius:0}
body[data-skin="graphite"] .kpi .num{font-family:'Doto','Geist Mono',monospace;font-weight:800}
body[data-skin="graphite"] .gs thead th,body[data-skin="graphite"] .vpo thead th{background:#FFFFFF;font-family:'Geist Mono',monospace;font-size:11px}
body[data-skin="graphite"] .gs tr.psec th.gl,body[data-skin="graphite"] .gs tr.psec td.fill,body[data-skin="graphite"] .pg tr.dept th,body[data-skin="graphite"] .pg tr.dept td.deptfill,body[data-skin="graphite"] .vpo tr.grp th{background:#F7F7F5;font-family:'Barlow Condensed',Geist,sans-serif;font-weight:500;font-size:19px;letter-spacing:.03em;text-transform:uppercase;color:#111113}
body[data-skin="graphite"] .gs tr.pjob th.gl{font-family:'Barlow Condensed',Geist,sans-serif;font-weight:500;font-size:19px;letter-spacing:.03em;text-transform:uppercase}
body[data-skin="graphite"] .gs tr.pjob th.gl .jl{font:inherit;color:inherit}
body[data-skin="graphite"] .gs tr.pjob th.gl .muted,body[data-skin="graphite"] .gs tr.pjob th.gl .btn{font-family:Geist,system-ui,sans-serif;font-size:12px;font-weight:500;letter-spacing:0;text-transform:none}
body[data-skin="graphite"] .gs tr.pjob th.gl .jl{text-decoration:none}body[data-skin="graphite"] .gs tr.pjob th.gl .jl:hover{text-decoration:underline}
body[data-skin="graphite"] .gs td.gc{font-size:11px}
body[data-skin="graphite"] .gs td.gc.away{background-image:repeating-linear-gradient(135deg,rgba(17,17,19,.16) 0 3px,transparent 3px 7px)}
body[data-skin="graphite"] .gs td.gc.clash{box-shadow:inset 0 0 0 2px #C9352B}
body[data-skin="graphite"] .askbtn,body[data-skin="graphite"] .ticketbtn{border-radius:0}
body[data-skin="graphite"] .sig{border-radius:0}
@media (prefers-reduced-motion:reduce){body[data-skin="graphite"] *{transition:none!important}}
@media (max-width:760px){body[data-skin="graphite"] .pagehead h1{font-size:52px}body[data-skin="graphite"] main{padding:0 16px 80px}body[data-skin="graphite"] .pagehead{margin:0 -16px 18px;padding:18px 16px}body[data-skin="graphite"] .top{padding:12px 16px 8px}}
/* graphite home */
.gh{margin:0 -32px}
.gh-band{background:#151517;color:#F5F5F4;padding:30px 32px 56px}
.gh-grid{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:48px;align-items:end;max-width:1376px;margin:0 auto}
.gh-date{font-family:'Geist Mono',monospace;font-size:13px;color:#A3A3A7}
.gh h1{font-family:'Tallboy',Geist,sans-serif;font-weight:400;font-size:92px;line-height:.88;letter-spacing:.01em;text-transform:uppercase;margin:10px 0 22px}
.gh-ask{display:flex;align-items:center;gap:10px;background:#FFFFFF;border:1px solid #E2E2DF;padding:8px 8px 8px 16px}
.gh-ask input{flex:1;border:none;outline:none;font:inherit;font-size:16px;background:transparent;color:#111113}
.gh-ask button{height:40px;padding:0 20px;border:none;background:#D8DBE0;color:#111113;font:inherit;font-size:14px;font-weight:600;cursor:pointer}
.gh-chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.gh-chips button{border:1px solid #2C2C30;background:transparent;color:#F5F5F4;border-radius:999px;padding:6px 12px;font:inherit;font-size:13px;cursor:pointer}
.gh-chips button:hover{border-color:#77777E}
.gh-stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));border-top:1px solid #2C2C30}
.gh-stats button{background:none;border:none;border-bottom:1px solid #2C2C30;color:inherit;text-align:left;padding:14px 0;cursor:pointer;font:inherit}

const chains={};
let active=0;const waiters=[];
function slot(){return new Promise(r=>{if(active<5){active++;r()}else waiters.push(r)})}
function release(){const n=waiters.shift();if(n)n();else active--}
async function withRetry(fn){for(let i=0;i<3;i++){try{return await fn()}catch(e){const c=e&&e.code;if((c==='resource_exhausted'||c==='unavailable')&&i<2){await new Promise(r=>setTimeout(r,800*(i+1)+Math.random()*400));continue}throw e}}}
function queue(key,fn){const p=(chains[key]||Promise.resolve()).then(async()=>{await slot();try{return await withRetry(fn)}finally{release()}}).catch(e=>{handleWriteErr(e)});chains[key]=p;return p}
const timers={};
const pendingW=new Set();
function persist(col,id,debounce){
  if(mode!=='shared'){lsSave();return}
  const key=col+'/'+id;pendingW.add(key);
  const go=()=>queue(key,()=>{const o=S[col][id];return (o?db.collection(col).doc(id).set(clone(o)):db.collection(col).doc(id).delete())}).then(()=>{if(!timers[key+'_t'])pendingW.delete(key)});
  if(debounce){clearTimeout(timers[key+'_t']);timers[key+'_t']=setTimeout(()=>{timers[key+'_t']=0;go()},600)}else go();
}

}

function workdays(from,to){const out=[];for(let t=from;t<=to;t+=DAY){const w=dow(t);if(w>0&&w<6)out.push(t)}return out}
function schedule(p,company){
  const res={days:[],roles:[],stageRanges:[],cost:0,hours:0,unplaced:[],end:NaN,start:NaN,costerFee:0};
  const s0=P(p.start);const stages=p.stages||[];
  if(isNaN(s0)||!stages.length)return res;
  const hpd=+p.hpd||S.config.hpd||7.5;
  const bounds=[];let acc=0;stages.forEach(s=>{const w=Math.max(0,+s.weeks||0);bounds.push([acc,acc+w]);acc+=w});
  const total=acc;
  const stageAt=pos=>{for(let i=0;i<bounds.length;i++)if(bounds[i][1]>bounds[i][0]&&pos>=bounds[i][0]-1e-9&&pos<bounds[i][1]-1e-9)return i;return -1};
  let mon=monday(s0),pw=0,g=0;
  while(pw<total-1e-9&&g++<260){
    const wk=[];for(let d=0;d<5;d++){const t=mon+d*DAY;wk.push({t,k:iso(t),pre:t<s0,hol:company[iso(t)]||'',d})}
    const counts=p.skipoff===false||wk.some(x=>!x.pre&&!x.hol);
    wk.forEach(x=>{x.stage=-1;if(counts&&!x.pre){const st=stageAt(pw+x.d/5);if(!x.hol)x.stage=st}x.work=x.stage>=0});
    res.days.push(...wk);if(counts)pw++;mon+=7*DAY;
  }
  const work=res.days.filter(d=>d.work);
  if(work.length){res.start=work[0].t;res.end=work[work.length-1].t}
  stages.forEach((s,k)=>{const sd=work.filter(d=>d.stage===k);res.stageRanges.push(sd.length?{name:s.name,from:sd[0].t,to:sd[sd.length-1].t,n:sd.length}:{name:s.name,from:NaN,to:NaN,n:0})});
  (p.roles||[]).forEach(r=>{
    const rs=P(r.start);const hours={};let H=0;const per=[];
    stages.forEach((s,k)=>{
      const d=+((r.days||[])[k])||0;const tot=p.mode==='week'?d*(+s.weeks||0):d;
      const avail=work.filter(x=>x.stage===k&&(isNaN(rs)||x.t>=rs));
      const rh=+r.hpd||hpd;const h=avail.length?tot*rh/avail.length:0;per.push(h);
      if(tot>0&&!avail.length)res.unplaced.push({role:r,stage:s.name,weeks:+s.weeks||0});
      avail.forEach(x=>{hours[x.k]=(hours[x.k]||0)+h;H+=h});
      res.costerFee+=d*(+s.weeks||0)*(+r.rate||0);
    });
    const cost=H/(+r.hpd||hpd)*(+r.rate||0);
    res.roles.push({r,hours,H,cost,per});res.cost+=cost;res.hours+=H;
  });
  return res;
}

function suggest(role,from,to,n){

  const wis=M.weeks.map((w,i)=>i).filter(i=>M.weeks[i]+4*DAY>=from&&M.weeks[i]<=to);if(!wis.length)return[];
  return M.people.map(pe=>{const pt=tokens(pe.role);const match=rt.filter(x=>pt.some(y=>y.slice(0,5)===x.slice(0,5))).length;
    let free=0;wis.forEach(i=>{const L=M.load[pe.id][i];free+=Math.max(0,L.cap-L.booked-L.pencil)});return {pe,match,free}})

function utilClass(L){if(!L.cap)return L.booked+L.pencil>0?'u4':(L.out&&!L.na?'out':'na');const u=(L.booked+L.pencil)/L.cap;if(u<=0.001)return 'u0';if(u<0.5)return 'u1';if(u<=0.85)return 'u2';if(u<=1.0001)return 'u3';return 'u4'}
function heatmap(list,emptyMsg){
  const {weeks,load}=M;const people=list||M.people;
  if(!people.length)return `<p class="muted">${emptyMsg||'No people yet. Add them on the People tab, or assign them in a project.'}</p>`;
  const thisW=monday(TODAY);
  let h=`<div class="scroll"><table class="heat"><thead><tr><th class="who">Person</th>${weeks.map(w=>`<th>${short(w)}</th>`).join('')}</tr></thead><tbody>`;
  people.forEach(pe=>{
    h+=`<tr><th class="who" scope="row"><button class="link" style="color:inherit;text-decoration:none" data-act="person" data-id="${pe.id}">${esc(pe.name)}</button><small>${esc(pe.role||'')}${pe.office?' · '+esc(pe.office):''}${pe.freelancer?' · '+esc(FLS[pe.flStatus||'booked']||'freelance'):''}</small></th>`;
    load[pe.id].forEach((L,wi)=>{
      const used=L.booked+L.pencil;const cls=utilClass(L);
      const tip=`${pe.name}, w/c ${short(weeks[wi])}: ${fh(used)}h of ${fh(L.cap)}h`+(L.pencil?` (${fh(L.pencil)}h pencilled)`:'')+(L.pipe?` · forecast +${fh(L.pipe)}h`:'')+(L.out?` · out ${L.out} day${L.out>1?'s':''}`:'')+'\n'+Object.values(L.by).map(x=>`${x.p.name}: ${fh(x.h)}h${x.kind!=='booked'?' ('+x.kind+')':''}`).join('\n');

      else inner=`${L.cap?Math.round(used/L.cap*100):'—'}%<small>${L.out?`out ${L.out}d`:fh(used)+'h'}</small>`;
      h+=`<td class="${cls==='na'?'u0':cls} ${L.pencil?'pen':''} ${weeks[wi]===thisW?'now':''}" title="${esc(tip)}" data-act="person" data-id="${pe.id}">${inner}</td>`;
    });
    h+='</tr>';
  });
  h+=`</tbody></table></div><div class="legend"><span><i style="background:var(--u1)"></i>Under 50%</span><span><i style="background:var(--u2)"></i>50–85%</span><span><i style="background:var(--u3)"></i>85–100%</span><span><i style="background:var(--u4)"></i>Over capacity</span><span><i style="background:repeating-linear-gradient(90deg,var(--watch) 0 4px,transparent 4px 7px)"></i>Includes pencilled time</span><span><i style="background:repeating-linear-gradient(135deg,var(--hatch) 0 3px,transparent 3px 7px)"></i>Out all week</span></div>`;
  return h;
}

function jobTeam(j){return [...new Set(M.rows.filter(r=>r.jobId===j.id&&r.personId).map(r=>r.personId))]}
function sinceLast(p){
  const lm=lastClosedMeeting();const s=lm&&lm.snapshot&&lm.snapshot[p.id];const jr=M.jobRange[p.id];
  if(!lm)return '<span class="muted">First meeting: no earlier snapshot.</span>';
  if(!s)return '<span class="muted">New since the last meeting.</span>';
  const bits=[];if(s.end&&jr&&s.end!==jr.end)bits.push(`Wrap moved ${short(s.end)} → ${short(jr.end)}`);
  if(s.group&&s.group!==(p.group||'live'))bits.push(`Status ${GROUPN[s.group]} → ${GROUPN[p.group||'live']}`);

const txt=v=>typeof v==='string'?v.trim():'';
const num=v=>typeof v==='number'?v:(typeof v==='string'&&v.trim()!==''&&!isNaN(+v)?+v:0);
function grid(ws){const ref=ws['!ref'];if(!ref)return[];const r=XLSX.utils.decode_range(ref);const g=[];for(let R=0;R<=Math.min(r.e.r,400);R++){const row=[];for(let C=0;C<=Math.min(r.e.c,80);C++){const c=ws[XLSX.utils.encode_cell({r:R,c:C})];row.push(c?c.v:null)}g.push(row)}return g}
function diagnose(g){
  let rr=-1,lc=-1,hr=-1,wc=-1,rate=-1;
  for(let R=0;R<g.length&&rr<0;R++)for(let C=0;C<g[R].length;C++)if(/^roles?$/i.test(txt(g[R][C]))){rr=R;lc=C;break}
  if(rr>=0)for(let R=rr+1;R<g.length&&hr<0;R++)for(let C=lc+1;C<g[R].length;C++)if(/^weeks?$/i.test(txt(g[R][C]))){hr=R;wc=C;break}
  if(rr>=0)for(let R=rr+1;R<(hr>=0?hr:Math.min(g.length,rr+6));R++)if(/rate/i.test(txt(g[R][lc]))){rate=R;break}
  const miss=[];if(rr<0)miss.push('a “Role” row');if(rate<0)miss.push('a “Day Rate” row');if(hr<0)miss.push('a “Weeks” column');
  return {rr,lc,hr,wc,rate,miss};
}
function findCoster(g){
  const {rr,lc,hr,wc,rate}=diagnose(g);if(rr<0||hr<0)return null;
  const roles=[];for(let C=wc+1;C<g[rr].length;C++){const name=txt(g[rr][C]);if(!name)continue;if(/^total/i.test(name))break;if(/select role/i.test(name))continue;roles.push({col:C,role:name,rate:rate>=0?num(g[rate][C]):0})}
  const stages=[];for(let R=hr+1;R<Math.min(g.length,hr+60);R++){const lab=txt(g[R][lc]);if(/^total/i.test(lab)||/\(\$\)/.test(lab))break;if(!lab)continue;stages.push({name:lab,weeks:num(g[R][wc]),days:roles.map(r=>num(g[R][r.col]))})}
  if(!stages.length||!roles.length)return null;
  const title=txt(g[0]&&g[0][lc]);let disc=null;
  for(const row of g)for(const v of row){const t=txt(v);const m=t.match(/(\d+(?:\.\d+)?)\s*%\s*(?:discount|off)/i)||t.match(/discount[^\d]{0,12}(\d+(?:\.\d+)?)\s*%/i);if(m&&disc==null)disc=+m[1]}
  const active=stages.some(st=>st.weeks>0&&st.days.some(d=>d>0));
  return {title,roles,stages,disc,active};
}

function rvOver(rv,r,k){const d=+r.days[k]||0,w=+rv.stages[k].weeks||0;return rv.mode==='week'?d>5.0001:(w>0&&d>5*w+0.0001)}
function rvSplitN(rv,r){let n=1;rv.stages.forEach((s,k)=>{const d=+r.days[k]||0,w=+s.weeks||0;const m=rv.mode==='week'?Math.ceil(d/5-1e-9):(w>0?Math.ceil(d/(5*w)-1e-9):1);if(m>n)n=m});return r.split?n:1}
function rvRole(rv,r){const rh=+r.hpd||rv.hpd;let days=0;rv.stages.forEach((s,k)=>{const d=+r.days[k]||0;days+=rv.mode==='week'?d*(+s.weeks||0):d});return {days,hours:days*rh,cost:days*(+r.rate||0),rh}}

function bindImport(){
  const drop=$('imp_drop'),fi=$('imp_file');if(!drop)return;

  drop.addEventListener('drop',e=>{const f=e.dataTransfer.files[0];if(f)readFile(f)});

function readFile(f){
  IMP={wb:null,file:f.name,sheet:'',parsed:null,err:''};
  const rd=new FileReader();
  rd.onload=e=>{try{IMP.wb=XLSX.read(new Uint8Array(e.target.result),{type:'array'});
      const meta=(IMP.wb.Workbook&&IMP.wb.Workbook.Sheets)||[];
      const c=IMP.wb.SheetNames.map((n,i)=>({n,hidden:!!(meta[i]&&meta[i].Hidden),p:findCoster(grid(IMP.wb.Sheets[n]))})).filter(x=>x.p);
      if(!c.length){IMP.err=`No fee sheet found in ${f.name}. A Coster needs a “Role” row, a “Day Rate” row and a “Weeks” column.`;renderDrawer();return}
      c.sort((a,b)=>(a.hidden-b.hidden)||((b.p.active?1:0)-(a.p.active?1:0)));
      const pref=(()=>{try{return localStorage.getItem('resource-hud:sheetpref')}catch(e){return null}})();
      pickSheet((pref&&c.find(x=>x.n===pref)||c[0]).n);
    }catch(err){IMP.err=`Couldn’t read ${f.name}. Save it as .xlsx and try again.`;renderDrawer()}};
  rd.readAsArrayBuffer(f);
}
function pickSheet(n){
  IMP.sheet=n;const g=grid(IMP.wb.Sheets[n]);const p=findCoster(g);
  if(!p){const d=diagnose(g);IMP.err=`“${n}” isn’t a fee sheet the HUD can read. It’s missing ${d.miss.join(', ').replace(/, ([^,]*)$/,' and $1')}.`;IMP.parsed=null;renderDrawer();return}
  try{localStorage.setItem('resource-hud:sheetpref',n)}catch(e){}
  IMP.err='';IMP.parsed=p;
  const base=IMP.file.replace(/\.[^.]+$/,'').replace(/_/g,' ');
  IMP.name=p.title&&p.title.length>=4&&!/^stage|^role/i.test(p.title)?p.title:`${base}: ${n}`;
  IMP.start=IMP.start||nextMonday();IMP.rv=rvFrom(p);
  renderDrawer();
}
function doImport(){
  const rv=IMP.rv;if(!rv)return;

  rv.roles.filter(r=>r.on).forEach(r=>{
    const n=rvSplitN(rv,r);
    for(let j=0;j<n;j++){
      const days=rv.stages.map((s,k)=>{const d=+r.days[k]||0;if(n===1)return d;return rvOver(rv,r,k)?Math.round(d/n*100)/100:(j===0?d:0)});
      if(!days.some(x=>x>0))continue;
      roles.push({id:uid(),role:n>1?`${r.role} ${j+1}`:r.role,rate:r.rate,hpd:r.hpd||null,days,personId:'',start:'',booking:rv.status==='pipeline'?'pencil':'booked'});
    }
  });

    stages:rv.stages.map(s=>({name:s.name,weeks:s.weeks})),roles,notes:'',source:`${IMP.file} › ${IMP.sheet}`,client:'',jobNo:'',csLead:''};
  save('projects',proj);const also=rv.alsoInt;

  if(also){compute();exportToInt(proj);return}

}

let SH={wb:null};
const UNITS=[['hpd','Hours per day'],['hpw','Hours per week'],['days','Days'],['any','Labels only (don’t count hours)']];
const MONS=['jan','feb','mar','apr','may','jun','jul','aug','sep','oct','nov','dec'];
const monIdx=v=>typeof v==='string'&&/^\s*[A-Za-z]{3,9}\.?\s*$/.test(v)?MONS.indexOf(v.trim().slice(0,3).toLowerCase()):-1;

function gridD(ws,maxR){const ref=ws['!ref'];if(!ref)return[];const r=XLSX.utils.decode_range(ref);const g=[];for(let R=0;R<=Math.min(r.e.r,maxR||600);R++){const row=[];for(let C=0;C<=Math.min(r.e.c,420);C++){const c=ws[XLSX.utils.encode_cell({r:R,c:C})];row.push(c?c.v:null)}g.push(row)}return g}
function mono(cols){const out=[];cols.forEach(x=>{if(!out.length||x.t>out[out.length-1].t)out.push(x)});return out}
function rowDates(g,R,year){
  const row=g[R]||[];let cols=[];
  row.forEach((v,c)=>{if(v instanceof Date&&!isNaN(v))cols.push({c,t:toUTC(v)})});
  if(cols.length>=3)return mono(cols);

  if(cols.length>=3)return mono(cols);

  if(nums.length<4)return null;
  for(let up=1;up<=3&&R-up>=0;up++){
    const marks=[];(g[R-up]||[]).forEach((v,c)=>{const mi=monIdx(v);if(mi>=0)marks.push({c,mi})});if(!marks.length)continue;
    const mk0=marks.filter(m=>m.c<=nums[0].c).pop()||marks[0];

    if(SH.yearSet)return build(year);
    const cands=[year,year-1,year+1,year-2].map(build);

    const score=c=>weekly?c.filter(x=>dow(x.t)===1).length:-c.filter(x=>dow(x.t)===0||dow(x.t)===6).length;

  }

function buildRows(g,det,unit){

  const step=(diffs[Math.floor(diffs.length/2)]||7)<=3?'day':'week';

function capOn(pe,t,ctx){

function compute(){
  const hpd=+S.config.hpd||7.5,H=Math.max(2,Math.min(26,+S.config.horizon||8));
  const asOf=V.asOf,w0=monday(asOf);
  const weeks=[...Array(H)].map((_,i)=>w0+i*7*DAY);
  const {company,person}=offIndex();
  const ctx={hpd,company,person};
  const projects=Object.values(DS().projects).sort((a,b)=>(a.name||'').localeCompare(b.name||''));
  const compH=Object.assign({},company);if((S.config.holidays||{}).US!==false){const y0=new Date(asOf).getUTCFullYear();[y0-1,y0,y0+1,y0+2].forEach(y=>Object.entries(holidaysFor('US',y)).forEach(([k,n])=>{if(!compH[k])compH[k]=n}))}
  const sched={};projects.forEach(p=>sched[p.id]=schedule(p,compH));
  const people=Object.values(DS().people).sort((a,b)=>(a.name||'').localeCompare(b.name||''));
  const load={},daily={};
  people.forEach(pe=>{
    load[pe.id]=weeks.map(w=>{let cap=0,out=0,na=0;const outs=[];
      workdays(w,w+4*DAY).forEach(t=>{const c=capOn(pe,t,ctx);if(c<0){na++;return}if(c===0){out++;const po=person[pe.id]&&person[pe.id][iso(t)];if(po)outs.push(po);return}cap+=c});
      return {cap,booked:0,pencil:0,pipe:0,pipeRaw:0,out,na,outs,by:{},jobs:new Set()}});
    daily[pe.id]={};
  });
  const jobs=jobList();const rows=Object.values(DS().plan||{});
  const jobRange={};
  const jobOf=r=>(DS().jobs||{})[r.jobId]||{id:'j:'+(r.project||'?'),name:r.project||'Untitled',group:secToGroup(r.sec||'')};
  rows.forEach(r=>{
    const job=jobOf(r);const pe=r.personId&&DS().people[r.personId];
    Object.entries(r.cells||{}).forEach(([k,c])=>{
      if(!c||c.k!=='b'||isOffLabel(c.v))return;const t=P(k);
      const jr=jobRange[job.id]=jobRange[job.id]||{start:t,end:t};if(t<jr.start)jr.start=t;if(t>jr.end)jr.end=t;
      if(!pe||!load[pe.id])return;
      const raw=c.h!=null&&c.h!==''?+c.h:(r.hpd!=null&&r.hpd!==''?+r.hpd:defaultHours(r.role));
      const base=Math.max(0,(+pe.capacity||hpd)-ovh(pe));const cd=capOn(pe,t,ctx);
      const h=cd<=0?0:(cd<base?raw*cd/base:raw);
      daily[pe.id][k]=(daily[pe.id][k]||[]).concat([{p:job,h,raw,row:r,ex:c.h!=null&&c.h!==''}]);
    });
  });
  if(S.config.autoSplit)Object.keys(daily).forEach(pid=>{const pe=DS().people[pid];if(!pe)return;Object.entries(daily[pid]).forEach(([k,es])=>{const cap=capOn(pe,P(k),ctx);if(cap<=0)return;const tot=es.reduce((a,x)=>a+x.h,0);if(tot<=cap+0.05)return;
    const exS=es.filter(x=>x.ex).reduce((a,x)=>a+x.h,0);const au=es.filter(x=>!x.ex);const auS=au.reduce((a,x)=>a+x.h,0);if(!auS)return;const f=Math.max(0,cap-exS)/auS;au.forEach(x=>{x.h=x.h*f;x.split=true})})});
  Object.entries(daily).forEach(([pid,days])=>Object.entries(days).forEach(([k,es])=>{const wi=Math.floor((monday(P(k))-w0)/(7*DAY));if(wi<0||wi>=H)return;const L=load[pid][wi];
    es.forEach(x=>{L.booked+=x.h;L.jobs.add(x.p.id);L.by[x.p.id]=(L.by[x.p.id]||{p:x.p,h:0,kind:'booked'});L.by[x.p.id].h+=x.h})}));
  Object.values(DS().bookings||{}).forEach(b=>{
    if(!b.personId||!load[b.personId])return;
    const p={id:'bk:'+(b.project||'Other work'),name:b.project||'Other work',group:'live',ext:true};const kind=b.kind==='pencil'?'pencil':'booked';
    Object.entries(b.hours||{}).forEach(([k,h])=>{if(!(h>0))return;const t=P(k),wi=Math.floor((monday(t)-w0)/(7*DAY));
      daily[b.personId][k]=(daily[b.personId][k]||[]).concat([{p,h,raw:h,row:null}]);
      if(wi<0||wi>=H)return;const L=load[b.personId][wi];L[kind]+=h;L.jobs.add(p.id);L.by[p.id]=(L.by[p.id]||{p,h:0,kind});L.by[p.id].h+=h});
  });

}
function alerts(){
  const A=[];const {weeks,load,people,asOf,H,person,daily,jobRange,rows}=M;
  const end14=asOf+14*DAY,horizonEnd=weeks[H-1]+4*DAY;
  const range=(a,b)=>a===b?nice(a):`${short(a)}–${short(b)}`;
  people.forEach(pe=>{
    load[pe.id].forEach((L,wi)=>{
      const used=L.booked+L.pencil;const w=weeks[wi];
      const names=Object.values(L.by).map(x=>`${x.p.name} ${fh(x.h)}h`).join(', ');
      const overD=[];let maxH=0,dayCap=0,naD=0;
      workdays(w,w+4*DAY).forEach(t=>{const k=iso(t);const es=(daily[pe.id][k]||[]).filter(x=>x.h>0||x.raw>0);if(!es.length)return;const c=capOn(pe,t,M.ctx);if(c<0){naD++;return}if(c===0)return;const hh=es.reduce((a,x)=>a+x.h,0);if(hh>c+0.05){overD.push(t);if(hh>maxH){maxH=hh;dayCap=c}}});
      if(overD.length)A.push({key:`over:${pe.id}:${w}`,sev:'danger',t:overD[0],text:overD.length===1?`${pe.name} is overbooked on ${nice(overD[0])}`:`${pe.name} is overbooked on ${overD.length} days w/c ${short(w)}`,sub:`Up to ${fh(maxH)}h of project work booked in a day, with ${fh(dayCap)}h available. ${names}`,target:['person',pe.id]});
      else if(wi<4&&L.cap>0&&used>0.9*L.cap)A.push({key:`near:${pe.id}:${w}`,sev:'warn',t:w,text:`${pe.name} is nearly full w/c ${short(w)} (${Math.round(used/L.cap*100)}%)`,sub:names,target:['person',pe.id]});
      if(pe.freelancer&&naD)A.push({key:`flna:${pe.id}:${w}`,sev:'warn',t:w,text:`${pe.name} (freelance) is booked w/c ${short(w)} outside their booked dates`,sub:names,target:['person',pe.id]});
      if(wi<3&&L.jobs.size>=4)A.push({key:`spread:${pe.id}:${w}`,sev:'warn',t:w,text:`${pe.name} is across ${L.jobs.size} projects w/c ${short(w)}`,sub:Object.values(L.by).map(x=>x.p.name).join(', '),target:['person',pe.id]});
    });
  });
  // time off clashing with bookings
  people.forEach(pe=>{
    const offs=person[pe.id]||{};const hits={};
    Object.entries(offs).forEach(([k,o])=>{const t=P(k);if(t<asOf||t>horizonEnd)return;const ty=OFF[o.type];if(!ty||ty.away===false)return;
      (daily[pe.id][k]||[]).forEach(({p,row})=>{const key=p.id;(hits[key]=hits[key]||{p,row,days:[],ty}).days.push(t)})});
    Object.values(hits).forEach(x=>{const a=Math.min(...x.days),b=Math.max(...x.days);const jr=jobRange[x.p.id];const wrap=jr&&b>=jr.end-7*DAY;
      const sg=x.row?suggest(x.row.role,a,b).filter(s=>s.pe.id!==pe.id):[];
      A.push({key:`conflict:${pe.id}:${x.p.id}:${a}:${b}`,sev:wrap?'danger':'warn',t:a,text:`${pe.name} is off ${range(a,b)} (${x.ty.label}) but is booked on ${x.p.name}`,
        sub:(wrap?`Lands in the last week before ${x.p.name} wraps (${nice(jr.end)}), so it could push the wrap. `:'')+(sg.length?`Has room to cover: ${sg.map(s=>s.pe.name+' '+fh(s.free)+'h').join(', ')}`:'Find cover or move the work.'),target:x.p.ext?['person',pe.id]:['job',x.p.id]});
    });
  });
  // who's out in the next two weeks
  people.forEach(pe=>{
    const offs=person[pe.id]||{};const ks=Object.keys(offs).sort();let run=null;const runs=[];
    ks.forEach(k=>{const o=offs[k];const ty=OFF[o.type];if(!ty||ty.away===false||ty.k==='closed')return;const t=P(k);
      if(run&&run.type===o.type&&workdays(run.b+DAY,t).length<=1)run.b=t;else{run={a:t,b:t,type:o.type,v:o.v};runs.push(run)}});
    runs.forEach(r=>{if(r.b<asOf||r.a>end14)return;const ty=OFF[r.type];A.push({key:`outsoon:${pe.id}:${r.a}`,sev:ty.tentative?'warn':'info',t:r.a,text:`${pe.name} is off ${range(r.a,r.b)}${ty.tentative?' (pending approval)':''}`,sub:ty.label+(r.v?': '+r.v:''),target:['person',pe.id]})});
  });
  // placeholders and starts / ends
  rows.forEach(r=>{
    if(r.personId)return;const ks=Object.keys(r.cells||{}).filter(k=>r.cells[k]&&r.cells[k].k==='b').sort();if(!ks.length)return;
    const a=P(ks[0]),b=P(ks[ks.length-1]);if(b<asOf||a>horizonEnd)return;const sg=suggest(r.role,Math.max(a,asOf),b);
    A.push({key:`ph:${r.id}`,sev:'warn',t:a,text:`${jobName(r.jobId)||r.project}: ${r.role||'role'} placeholder needs someone`,sub:`Booked ${range(Math.max(a,asOf),b)}`+(sg.length?`. Has room: ${sg.map(x=>x.pe.name+(x.pe.office?' ('+x.pe.office+')':'')+' '+fh(x.free)+'h').join(', ')}`:''),target:['job',r.jobId]});
  });
  M.jobs.forEach(j=>{const jr=jobRange[j.id];if(!jr||!['live','pitch','extension','awaiting'].includes(j.group))return;
    if(jr.start>asOf&&jr.start<=end14&&jr.start>P(S.config.gridStart||'1970-01-01')+7*DAY)A.push({key:`starts:${j.id}`,sev:'info',t:jr.start,text:`${j.name} kicks off ${nice(jr.start)}`,sub:'',target:['job',j.id]});
    if(jr.end>=asOf&&jr.end<=end14)A.push({key:`ends:${j.id}`,sev:'info',t:jr.end,text:`${j.name} wraps ${nice(jr.end)}`,sub:'Line up what the team moves onto next',target:['job',j.id]});
    const lm=lastClosedMeeting();const s=lm&&lm.snapshot&&lm.snapshot[j.id];
    if(s&&s.end&&jr.end!==s.end)A.push({key:`end:${j.id}:${jr.end}`,sev:jr.end>s.end?'warn':'info',t:asOf,text:`${j.name} now wraps ${nice(jr.end)}`,sub:`Was ${nice(s.end)} at the last meeting`,target:['job',j.id]});
  });
  // freelancers
  people.filter(pe=>pe.freelancer).forEach(pe=>{
    const ks=Object.keys(daily[pe.id]||{}).filter(k=>P(k)>=asOf).sort();if(!ks.length)return;const first=P(ks[0]);if(first>end14)return;
    const projs=[...new Set(ks.flatMap(k=>daily[pe.id][k].map(x=>x.p.name)))].join(', ');
    if((pe.flStatus||'booked')==='pencilled')A.push({key:`flpen:${pe.id}`,sev:'warn',t:first,text:`Confirm ${pe.name}'s freelance booking`,sub:`Pencilled, starts ${nice(first)} on ${projs}`,target:['person',pe.id]});
    else if(['recruiting','released'].includes(pe.flStatus))A.push({key:`flstat:${pe.id}`,sev:'danger',t:first,text:`${pe.name} is ${pe.flStatus} but booked from ${nice(first)}`,sub:projs,target:['person',pe.id]});
    if(!pe.paprika&&['booked','pencilled'].includes(pe.flStatus||'booked')&&!pe.longTerm)A.push({key:`flpap:${pe.id}`,sev:'warn',t:first,text:`${pe.name} isn't set up in Paprika yet`,sub:`Freelance, on ${projs}`,target:['person',pe.id]});
  });
  const rank={danger:0,warn:1,fore:2,info:3};
  A.sort((a,b)=>rank[a.sev]-rank[b.sev]||a.t-b.t);
  return A;
}

function moveRows(ids,targetRow,before){

  const same=Object.values(DS().plan).filter(r=>r.jobId===T.jobId&&!ids.includes(r.id)).sort((a,b)=>(a.order||0)-(b.order||0));
  const at=same.findIndex(r=>r.id===targetRow)+(before?0:1);const list=same.slice(0,at).concat(ids.map(id=>DS().plan[id]).filter(Boolean)).concat(same.slice(at));
  const j=(DS().jobs||{})[T.jobId];
  list.forEach((r,i)=>{if(r.order!==i||ids.includes(r.id)){const c=clone(r);c.order=i;if(ids.includes(r.id)){c.jobId=T.jobId;c.project=j?j.name:c.project}save('plan',c)}});
}
function moveRowsToJob(ids,jobId){const j=(DS().jobs||{})[jobId];const same=Object.values(DS().plan).filter(r=>r.jobId===jobId&&!ids.includes(r.id));const mn=same.length?Math.min(...same.map(r=>r.order||0)):0;
  ids.forEach((id,i)=>{const c=clone(DS().plan[id]);c.jobId=jobId;c.project=j?j.name:'';c.order=mn-ids.length+i;save('plan',c)})}
function moveJob(jobId,targetJob,toSec){
  const js=jobList();const jo=jobPorder();const j=(DS().jobs||{})[jobId];if(!j)return;
  let order=js.slice().sort((a,b)=>jo[a.id]-jo[b.id]).filter(x=>x.id!==jobId);
  let newGroup=j.group;
  if(targetJob){const t=DS().jobs[targetJob];if(!t)return;const i=order.findIndex(x=>x.id===targetJob);order.splice(i,0,j);if(GROUP_SEC[t.group]!==GROUP_SEC[j.group])newGroup=t.group}
  else if(toSec){newGroup=SEC_GROUP[toSec]||j.group;const i=order.findIndex(x=>GROUP_SEC[x.group]===toSec);order.splice(i<0?order.length:i,0,j)}
  order.forEach((x,i)=>{if(x.porder!==i||(x.id===jobId&&newGroup!==x.group)){const c=clone(x);c.porder=i;if(x.id===jobId)c.group=newGroup;save('jobs',c)}});
  if(newGroup!==j.group)toast(`${j.name} moved to ${GROUP_SEC[newGroup]}.`,'info');
}

function moveOJob(id,tj,g){const j=DS().jobs[id];if(!j)return;const list=jobList().filter(x=>x.id!==id);let ng=j.group||'live',idx;
  if(tj){const t=DS().jobs[tj];if(!t)return;ng=t.group||'live';idx=list.findIndex(x=>x.id===tj)}else{ng=g;const inG=list.filter(x=>(x.group||'live')===g);idx=inG.length?list.indexOf(inG[0]):list.length}
  list.splice(idx,0,j);list.forEach((x,i)=>{const moved=x.id===id&&ng!==(j.group||'live');if(x.order!==i||moved){const c=clone(DS().jobs[x.id]);c.order=i;if(x.id===id)c.group=ng;save('jobs',c)}});

const HIST={undo:[],redo:[],tx:null,muted:false};
function txPush(e){if(HIST.muted)return;if(!HIST.tx){HIST.tx=[];setTimeout(()=>{if(HIST.tx&&HIST.tx.length){HIST.undo.push(HIST.tx);if(HIST.undo.length>100)HIST.undo.shift();HIST.redo=[]}HIST.tx=null},0)}
  if(!HIST.tx.some(x=>x.col===e.col&&x.id===e.id&&x.scen===e.scen))HIST.tx.push(e)}
function recDoc(col,id,before){txPush({col,id,before:before?clone(before):null,scen:SCOLS.includes(col)?V.scenario:null})}
function recCfg(before){txPush({col:'config',id:'main',before,scen:null})}
function curDoc(e){if(e.col==='config')return clone(S.config);const store=e.scen&&S.scenarios[e.scen]?S.scenarios[e.scen].data[e.col]||{}:S[e.col];return store[e.id]?clone(store[e.id]):null}
function applyHist(from,to,label){
  const tx=from.pop();if(!tx){toast(`Nothing to ${label}.`,'info');return}const inv=[];HIST.muted=true;
  try{tx.forEach(e=>{inv.push(Object.assign({},e,{before:curDoc(e)}));
    if(e.col==='config'){S.config=clone(e.before);saveConfig();return}
    const k=V.scenario;V.scenario=e.scen;try{if(e.before)save(e.col,clone(e.before));else remove(e.col,e.id)}finally{V.scenario=k}})}finally{HIST.muted=false}
  to.push(inv);toast(label==='undo'?'Undone.':'Redone.','info');render();
}
function undo(){applyHist(HIST.undo,HIST.redo,'undo')}
function redo(){applyHist(HIST.redo,HIST.undo,'redo')}

  const jobs={};const jobByKey={};let ord=0;
  const colorToCode=(v,bg)=>v==='P'&&bg&&bg.toUpperCase()==='#4A86E8'?'PH':v;
  SEED.visual.items.forEach(it=>{const j={id:uid(),name:it.name.replace(/\s+/g,' ').trim(),group:it.group,dd:byIni[it.dd]?byName[byIni[it.dd]]:'',cs:byIni[it.cs]?byName[byIni[it.cs]]:'',no:it.no,order:ord++,cells:{},notes:''};
    Object.entries(it.cells).forEach(([w,c])=>{j.cells[w]={v:colorToCode(c.v,c.bg),bg:c.bg||''}});jobs[j.id]=j;jobByKey[j.group+':'+j.name.toLowerCase()]=j.id});
  const alias={'trip':'trip.com','riot flx':'riot','ea sports':'ea sports app incubator'};
  const findJ=(sec,proj)=>{const g=secToGroup(sec);let n=proj.toLowerCase().trim();n=alias[n]||n;const key=(g==='pitch'?'pitch':g)+':'+n;if(jobByKey[key])return jobByKey[key];
    const any=Object.values(jobs).find(j=>j.name.toLowerCase()===n&&(g!=='casestudy'||j.group==='casestudy'));if(any&&g!=='casestudy')return any.id;
    const j={id:uid(),name:proj.trim(),group:g,order:ord++,cells:{},dd:'',cs:'',notes:''};jobs[j.id]=j;jobByKey[g+':'+n]=j.id;return j.id};

    const row={id:uid(),sec,jobId:findJ(sec,r.project),project:r.project,role:r.role,personId:pid,hpd:null,order:o++,cells};plan[row.id]=row});

    Object.entries(r.cells).forEach(([k,c])=>{const t=c.bg?COLORMAP[c.bg.toUpperCase()]:(c.v==='0.5'?'half':(c.v?'online':''));if(!t)return;cells[k]={t,v:c.v==='0.5'?'':c.v}});pto[pid]={id:pid,cells}});

/* ================= HUB: roles and access ================= */
const ROLE_RANK={team:0,director:1,admin:2};
const ROLE_NAME={admin:'Admin',director:'Director',team:'Team'};
const OPEN_COLS=['tasks','tickets','updates','members','alertstate','fltickets'];
function linkRole(){const h=(location.hash||'').replace('#','').toLowerCase();return h==='admin'?'admin':h==='directors'||h==='director'?'director':h==='team'?'team':''}
function myMember(){return V.me&&V.me.id?S.members[V.me.id]:null}
function myPersonId(){const m=myMember();return m&&m.personId||''}
function role(){
  if(!V.me||!V.me.id)return V.preview||'admin';                 // no sign-in info (local / preview): full access
  let r=V.me.isOwner?'admin':(myMember()&&myMember().role)||'team';
  const l=linkRole();if(l&&ROLE_RANK[l]<ROLE_RANK[r])r=l;          // a link can show less, never more
  if(V.preview&&ROLE_RANK[V.preview]<=ROLE_RANK[r])r=V.preview;
  return r;
}
const isAdmin=()=>role()==='admin';
function ro(col){
  if(V.allowWrite)return false;
  if(V.readOnly){toast('You can view this HUB but not change it.','warn');return true}
  if(isAdmin())return false;
  if(col&&OPEN_COLS.includes(col))return false;
  if(col==='meetings'&&role()==='director')return false;
  toast(role()==='director'?'Directors can see everything but only admins change the plan. Assign yourself a to-do or add a note instead.':'Only admins can change the plan.','warn');return true;
}

  else if(now-(m.lastSeen||0)>3600e3){const c=clone(m);c.lastSeen=now;save('members',c)}
}
function applyRole(){const r=role();document.body.dataset.role=r;}

/* ================= HUB: alert routing, clearing and to-dos ================= */
function alertWho(a){
  const k=a.key||'';const parts=k.split(':');const ids=new Set();
  if(/^(over|near|spread|outsoon|flpen|flstat|flpap|flna|out-booked|conflict):/.test(k))ids.add(parts[1]);
  const jid=a.target&&a.target[0]==='job'?a.target[1]:null;
  if(jid&&DS().jobs[jid]){const j=DS().jobs[jid];if(j.dd)ids.add(j.dd);if(j.cs)ids.add(j.cs)}
  if(a.target&&a.target[0]==='person')ids.add(a.target[1]);
  return [...ids].filter(Boolean);
}
function alertState(key){return Object.values(S.alertstate||{}).find(s=>s.key===key)}
function myTasks(){const pid=myPersonId();const me=V.me&&V.me.id;return Object.values(S.tasks||{}).filter(t=>t.status==='open'&&((pid&&t.assignee===pid)||(!t.assignee&&t.ownerUser===me)))}
function taskReminders(list){
  const out=[];list.forEach(t=>{const due=P(t.due);if(isNaN(due))return;const d=Math.round((due-TODAY)/DAY);if(d>1)return;
    out.push({key:'task:'+t.id,sev:d<0?'danger':'warn',t:due,text:d<0?`Overdue to-do: ${t.text}`:d===0?`Due today: ${t.text}`:`Due tomorrow: ${t.text}`,sub:d<0?`${-d} day${d<-1?'s':''} late. Tick it off, reschedule it, or mark it not needed.`:'From your to-do list',target:['todo',t.id],task:true})});return out}
function visibleAlerts(){
  const all=M.alerts;const R=S.config.routing||{};const r=role();
  if(r==='admin'){
    const showCleared=V.showCleared;const base=all.filter(a=>{const st=alertState(a.key);return showCleared||!st});
    const overdue=Object.values(S.tasks||{}).filter(t=>t.status==='open'&&P(t.due)<TODAY);
    const extra=overdue.length?[{key:'tasks-overdue',sev:'warn',t:TODAY,text:`${overdue.length} to-do${overdue.length>1?'s are':' is'} overdue across the team`,sub:overdue.slice(0,4).map(t=>`${t.assignee?personName(t.assignee):'Unassigned'}: ${t.text}`).join('; '),target:['todos','all']}]:[];
    return iGetFlAlerts().concat(taskReminders(myTasks()),extra,base);
  }
  const pid=myPersonId();const mine=all.filter(a=>{if(alertState(a.key)&&alertState(a.key).status==='cleared')return false;const who=alertWho(a);
    if(pid&&who.includes(pid)&&R.personal!==false)return true;
    if(r==='director'&&R.directors!==false&&pid&&a.target&&a.target[0]==='job'){const j=DS().jobs[a.target[1]];if(j&&(j.dd===pid||j.cs===pid))return true}
    return false});
  return iGetFlAlerts().concat(taskReminders(myTasks()),mine);
}

/* ================= HUB: balance hours ================= */
function balanceDrawer(d){
  const pe=DS().people[d.pid];if(!pe)return '';const days=workdays(d.w,d.w+4*DAY);
  let h=`<div class="head"><h2 style="margin:0;flex:1">${esc(pe.name)}: hours, week of ${short(d.w)}</h2><button class="btn" data-act="closedrawer">Close</button></div>
  <p class="muted">Each day should add up to ${fh(Math.max(0,(+pe.capacity||M.hpd)-ovh(pe)))}h. Type hours for each project, or use the buttons to split the day. Changes save straight away and update the alerts.</p>
  <div class="row" style="margin-bottom:10px"><button class="btn" data-act="y-bsplitall" title="Every day this week: share the day equally between their projects">Split every day evenly</button><button class="btn" data-act="y-bfitall" title="Every day this week: shrink hours so the day adds up, keeping the same proportions">Fit every day to the limit</button><button class="btn" data-act="y-bresetall" title="Go back to the default hours for each role">Reset to role defaults</button></div>`;
  days.forEach(t=>{const k=iso(t);const es=(M.daily[pe.id][k]||[]).filter(x=>x.row);const cap=capOn(pe,t,M.ctx);const tot=es.reduce((a,x)=>a+x.h,0);
    h+=`<div class="panel bday ${tot>cap+0.05?'overday':''}"><div class="row" style="justify-content:space-between"><b>${nice(t)}</b><span class="${tot>cap+0.05?'neg':'muted'}">${fh(tot)}h of ${fh(Math.max(0,cap))}h${cap===0?' (off)':''}</span></div>`+
    (es.length?`<table class="tbl"><tbody>${es.map(x=>`<tr><td>${esc(x.p.name)}</td><td class="muted small">${esc(x.row.role||'')}</td><td class="r"><input type="number" min="0" step="0.25" data-bh="${x.row.id}" data-k="${k}" value="${fh(x.h)}" aria-label="Hours on ${esc(x.p.name)}"> h${x.ex?'':` <span class="muted small" title="Not set by hand yet">${x.split?'auto-split':'default'}</span>`}</td></tr>`).join('')}</tbody></table>
    <div class="row" style="margin-top:6px"><button class="btn sm" data-act="y-bsplit" data-k="${k}">Split evenly</button><button class="btn sm" data-act="y-bfit" data-k="${k}">Fit to ${fh(Math.max(0,cap))}h</button></div>`:'<p class="muted small">Nothing booked.</p>')+'</div>'});
  return h;
}
function setCellHours(rowId,k,h){const r=clone(DS().plan[rowId]);if(!r||!r.cells[k])return;if(h==null)delete r.cells[k].h;else r.cells[k].h=Math.round(h*100)/100;save('plan',r)}
function balanceDay(pid,k,how){
  const pe=DS().people[pid];const es=(M.daily[pid][k]||[]).filter(x=>x.row);if(!es.length)return;const cap=Math.max(0,capOn(pe,P(k),M.ctx));
  const byRow={};es.forEach(x=>{byRow[x.row.id]=(byRow[x.row.id]||0)+x.h});const ids=Object.keys(byRow);const tot=ids.reduce((a,id)=>a+byRow[id],0);
  if(how==='reset'){ids.forEach(id=>setCellHours(id,k,null));return}
  ids.forEach(id=>setCellHours(id,k,how==='split'?cap/ids.length:(tot>0?byRow[id]*Math.min(1,cap/tot):cap/ids.length)));
}

function clashInfo(a){
  const m=/^conflict:([^:]+):([^:]+):(\d+):(\d+)$/.exec(a.key||'');if(!m)return null;
  const pid=m[1],jid=m[2],from=+m[3],to=+m[4];const pe=DS().people[pid],job=(DS().jobs||{})[jid];if(!pe||!job)return null;

/* ================= HUB: public holidays (synced to the real calendar) ================= */
const HOLCACHE={};
function easterSun(y){const a=y%19,b=Math.floor(y/100),c=y%100,d=Math.floor(b/4),e=b%4,f=Math.floor((b+8)/25),g=Math.floor((b-f+1)/3),h=(19*a+b-d-g+15)%30,i=Math.floor(c/4),k=c%4,l=(32+2*e+2*i-h-k)%7,m=Math.floor((a+11*h+22*l)/451),mo=Math.floor((h+l-7*m+114)/31),da=((h+l-7*m+114)%31)+1;return Date.UTC(y,mo-1,da)}
function nthDow(y,m,wd,n){if(n>0){let t=Date.UTC(y,m,1);while(dow(t)!==wd)t+=DAY;return t+(n-1)*7*DAY}let t=Date.UTC(y,m+1,0);while(dow(t)!==wd)t-=DAY;return t}
function usObs(t){const w=dow(t);return w===6?t-DAY:w===0?t+DAY:t}
function holidaysFor(region,y){
  const key=region+y;if(HOLCACHE[key])return HOLCACHE[key];const L=[];const add=(t,n)=>L.push([t,n]);
  if(region==='US'){
    add(usObs(Date.UTC(y,0,1)),'New Year’s Day');add(nthDow(y,0,1,3),'MLK Day');add(nthDow(y,1,1,3),'Presidents’ Day');add(nthDow(y,4,1,-1),'Memorial Day');
    add(usObs(Date.UTC(y,5,19)),'Juneteenth');add(usObs(Date.UTC(y,6,4)),'Independence Day');add(nthDow(y,8,1,1),'Labor Day');add(nthDow(y,9,1,2),'Indigenous Peoples’ Day');
    add(usObs(Date.UTC(y,10,11)),'Veterans Day');const tg=nthDow(y,10,4,4);add(tg,'Thanksgiving');if((S.config.holidays||{}).tgFriday!==false)add(tg+DAY,'Day after Thanksgiving');add(usObs(Date.UTC(y,11,25)),'Christmas Day');
  }else if(region==='UK'){
    let ny=Date.UTC(y,0,1);if(dow(ny)===6)ny+=2*DAY;else if(dow(ny)===0)ny+=DAY;add(ny,'New Year’s Day');
    const es=easterSun(y);add(es-2*DAY,'Good Friday');add(es+DAY,'Easter Monday');add(nthDow(y,4,1,1),'Early May bank holiday');add(nthDow(y,4,1,-1),'Spring bank holiday');add(nthDow(y,7,1,-1),'Summer bank holiday');
    const xm=Date.UTC(y,11,25),w=dow(xm);if(w===6){add(xm+2*DAY,'Christmas Day (substitute)');add(xm+3*DAY,'Boxing Day (substitute)')}else if(w===0){add(xm+2*DAY,'Christmas Day (substitute)');add(xm+DAY,'Boxing Day')}else if(w===5){add(xm,'Christmas Day');add(xm+3*DAY,'Boxing Day (substitute)')}else{add(xm,'Christmas Day');add(xm+DAY,'Boxing Day')}
  }
  const o={};L.forEach(([t,n])=>{o[iso(t)]=n});return HOLCACHE[key]=o;
}
