  const sc=M.sched[sel.id]||{roles:[],days:[],cost:0,costerFee:0};const fee=sc.costerFee||0;const disc=+sel.disc||0;const tl=sc.cost||0;
  const jid=findJobByName(sel.name);let spent=0;if(jid){M.rows.filter(r=>r.jobId===jid).forEach(r=>{const cr=(sel.roles||[]).find(x=>tokens(x.role).some(t=>tokens(r.role).some(u=>u.slice(0,5)===t.slice(0,5))));const rate=cr?+cr.rate||0:0;Object.entries(r.cells||{}).forEach(([k,c])=>{if(c&&c.k==='b'){const pe=r.personId&&DS().people[r.personId];const es=pe?(M.daily[pe.id][k]||[]).find(x=>x.row&&x.row.id===r.id):null;const hh=es?es.h:(r.hpd!=null&&r.hpd!==''?+r.hpd:defaultHours(r.role));spent+=hh/(+sel.hpd||M.hpd)*rate}})})}
  const budget=fee?fee*(1-disc/100):tl;const left=budget-spent;const pct=budget?Math.round(spent/budget*100):0;
  h+=`<div class="kpis"><div class="kpi"><div class="num">${fm(budget)}</div><span>budget${disc?' after '+disc+'% discount':''}</span></div><div class="kpi"><div class="num">${fm(tl)}</div><span>coster timeline cost</span></div><div class="kpi"><div class="num">${jid?fm(spent):'—'}</div><span>${jid?'planned in the Team plan':'not in the Team plan yet'}</span></div><div class="kpi"><div class="num" style="color:${left<0?'var(--over)':'inherit'}">${jid?fm(left):'—'}</div><span>${left<0?'over budget':'left'}</span></div></div>
  ${jid?`<div class="bar big ${left<0?'over':''}" style="margin:4px 0 12px"><span style="width:${Math.min(100,pct)}%"></span></div>`:''}
  <div class="scroll"><table class="tbl"><thead><tr><th>Role</th><th>Person</th><th class="r">Day rate</th>${(sel.stages||[]).map(st=>`<th class="r" title="${esc(st.name)}">${esc(st.name)}<br><span class="muted small">${st.weeks||0} wk</span></th>`).join('')}<th class="r">Hours</th><th class="r">Cost</th></tr></thead><tbody>
  ${sc.roles.map(x=>`<tr><td>${esc(x.r.role)}</td><td>${x.r.personId?esc(personName(x.r.personId)):'<span class="pill pencil">Placeholder</span>'}</td><td class="r">${fm(+x.r.rate||0)}</td>${(sel.stages||[]).map((st,i)=>`<td class="r">${((st.days||[])[(sel.roles||[]).indexOf(x.r)])||''}</td>`).join('')}<td class="r">${fh(x.H||0)}</td><td class="r">${fm(x.cost||0)}</td></tr>`).join('')}
  </tbody></table></div>
  <div class="row" style="margin-top:12px;flex-wrap:wrap"><button class="btn primary" data-act="coster2plan" data-id="${sel.id}" title="Adds day-by-day rows for each role to the Team plan, replacing any rows it added before">Send to Team plan</button>${downloads?`<button class="btn" data-act="costerxlsx" data-id="${sel.id}">Download day-by-day sheet</button>`:''}<span class="muted small">${(Object.values(S.int||{}).find(x=>x.costedId===sel.id)||{}).sentAt?'Last sent to the Team plan '+new Date(Object.values(S.int).find(x=>x.costedId===sel.id).sentAt).toLocaleDateString('en-US',{month:'short',day:'numeric'}):'Not sent to the Team plan yet'}</span></div></div>`;
  return h;
}

/* ================= HUB: wiring ================= */
document.addEventListener('click',e=>{
  const el=e.target.closest&&e.target.closest('[data-act]');if(!el)return;const a=el.dataset.act;
  switch(a){
    case 'flnew':V.drawer={type:'flreq',jobId:el.dataset.job||''};renderDrawer();break;
    case 'flopts':V.drawer={type:'flopts',id:el.dataset.id};renderDrawer();break;
    case 'flsend':flSendOptions(el.dataset.id);break;
    case 'flbook':flBook(el.dataset.id,+el.dataset.i);break;
    case 'flclose':if(armed(el,'Click again to close'))flClose(el.dataset.id);break;
    case 'ppadd':ppAdd();break;
    case 'ppsplit':{const s=V.sel;if(!s)break;s.rows.forEach(pid=>selKeys().forEach(k=>balanceDay(pid,k,'split')));closePop();toast('Each day shared out evenly.','info');break}
    case 'ppclear':{const r=clone(DS().plan[el.dataset.id]);if(!r)break;selKeys().forEach(k=>{delete r.cells[k]});save('plan',r);closePop();break}
    case 'pp2pto':closePop();ptoPop();break;
    case 'costersel':V.costerSel=el.dataset.id;render();break;
    case 'coster2plan':{const p=S.projects[el.dataset.id];if(p)costerToPlan(p);break}
    case 'costerxlsx':{const p=S.projects[el.dataset.id];const x=p&&buildInt(p);if(x)intXlsx(x);else toast('Set a start date and stage weeks on the coster first.','warn');break}
    case 'addmarker':{const box=$('mk_new');if(box)box.classList.remove('hide');setTimeout(()=>$('mk_code')&&$('mk_code').focus(),0);break}
    case 'savemarker':{const d=POP&&POP.data;if(!d)break;const code=($('mk_code').value||'').trim().toUpperCase().slice(0,3),label=($('mk_label').value||'').trim(),bg=$('mk_bg').value||'#D9D9D9';if(!code||!label){toast('Give the marker a short code and a name.','warn');break}
      cfgEdit(c=>{c.customStages=(c.customStages||[]).filter(x=>x.c!==code).concat([{c:code,label,bg}])});const j=clone(DS().jobs[d.job]);j.cells=j.cells||{};j.cells[d.w]={v:code,bg};save('jobs',j);closePop();toast(`Marker ${code} added.`,'info');break}
  }
});
document.addEventListener('submit',e=>{if(e.target.id==='flform'){e.preventDefault();flSubmit()}});
document.addEventListener('change',e=>{const el=e.target;
  if(el.dataset.pph){const v=parseFloat(el.value);selKeys().forEach(k=>setCellHours(el.dataset.pph,k,isNaN(v)?null:Math.max(0,v)));return}
  if(el.dataset.fla){cfgEdit(c=>{const s=new Set(c.flAdmins||[]);el.checked?s.add(el.dataset.fla):s.delete(el.dataset.fla);c.flAdmins=[...s]});return}
  if(el.dataset.holi){cfgEdit(c=>{c.holidays=Object.assign({},c.holidays||{});c.holidays[el.dataset.holi]=el.checked});Object.keys(HOLCACHE).forEach(k=>delete HOLCACHE[k]);return}
});

function peoplePop(){return V.pview==='proj'?projPop():ptoPop()}


/* ================= HUB: calendar zoom ================= */
const ZL=[1,.75,.5,.35,.2];
V.zoom=(()=>{try{const z=localStorage.getItem('resource-hub:zoom');return z==='fit'?'fit':(ZL.includes(+z)?+z:1)}catch(e){return 1}})();
function zoomCtl(){const z=V.zoom;return `<span class="zoomctl" role="group" aria-label="Zoom"><button class="btn sm" data-act="z-out" title="Zoom out to see more of the calendar" aria-label="Zoom out" ${z!=='fit'&&z<=ZL[ZL.length-1]?'disabled':''}>−</button><span class="small zl">${z==='fit'?'Fit':Math.round(z*100)+'%'}</span><button class="btn sm" data-act="z-in" title="Zoom in" aria-label="Zoom in" ${z===1?'disabled':''}>+</button><button class="btn sm ${z==='fit'?'primary':''}" data-act="z-fit" title="Fit the whole calendar on screen" aria-pressed="${z==='fit'}">Fit all</button></span>`}
function setZoom(z){V.zoom=z;try{localStorage.setItem('resource-hub:zoom',String(z))}catch(e){}document.querySelectorAll('.zoomctl').forEach(el=>{el.outerHTML=zoomCtl()});applyZoom()}
function applyZoom(){
  const G=document.body.dataset.skin==='graphite';
  document.querySelectorAll('#main table.gs, #main table.vpo').forEach(tb=>{
    const vpo=tb.classList.contains('vpo');const n=vpo?tb.querySelectorAll('thead th.hx').length:tb.querySelectorAll('thead th.dn').length;if(!n)return;
    const base=vpo?(G?56:40):30;let size;
    if(V.zoom==='fit'){const wrap=tb.closest('.sheet,.board,.scroll')||tb.parentElement;let fixed=0;
      if(vpo)tb.querySelectorAll('thead tr:first-child th:not(.hx)').forEach(th=>fixed+=th.getBoundingClientRect().width);
      else tb.querySelectorAll('thead tr:first-child th.f').forEach(th=>fixed+=th.getBoundingClientRect().width);
      const avail=(wrap.clientWidth||0)-fixed-6;size=avail>0?Math.max(3,Math.min(base,avail/n)):base*0.35}
    else size=base*V.zoom;
    tb.style.setProperty(vpo?'--ww':'--dw',size.toFixed(2)+'px');tb.classList.toggle('zoomed',size<(vpo?34:22));tb.classList.toggle('zoomed2',size<10);
  });
}
document.addEventListener('click',e=>{const el=e.target.closest&&e.target.closest('[data-act^="z-"]');if(!el)return;const a=el.dataset.act;const cur=V.zoom==='fit'?.35:V.zoom;
  if(a==='z-fit')setZoom(V.zoom==='fit'?1:'fit');
  else if(a==='z-out'){const nx=ZL.find(z=>z<cur-1e-9);setZoom(nx!=null?nx:ZL[ZL.length-1])}
  else if(a==='z-in'){const nx=[...ZL].reverse().find(z=>z>cur+1e-9);setZoom(nx!=null?nx:1)}});
let zrt=0;window.addEventListener('resize',()=>{if(V.zoom!=='fit')return;clearTimeout(zrt);zrt=setTimeout(applyZoom,120)});

/* ---------- boot ---------- */
applySkin();V.tab='home';setStatus();renderNav();render();initCaps();
setTimeout(()=>{if(mode==='connecting'){mode='local';lsLoad();V.ready=true;setStatus();render()}},11000);
})();
